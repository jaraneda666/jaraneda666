<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="auto">
  <defs>
    <style>
      .window { fill: #0b1120; rx: 12px; stroke: #1e293b; stroke-width: 1.5; }
      .header { fill: #131d31; }
      .btn-red { fill: #ef4444; }
      .btn-yellow { fill: #f59e0b; }
      .btn-green { fill: #10b981; }
      .title { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; text-anchor: middle; font-weight: 500; }
      .code { font-family: "Fira Code", "Cascadia Code", "JetBrains Mono", Consolas, monospace; font-size: 13.5px; }
      
      /* Segmentos Powerline Base */
      .seg-user { fill: #1e293b; }
      .seg-text-user { fill: #e2e8f0; font-weight: bold; }
      .seg-text-path { fill: #ffffff; font-weight: bold; }
      .cmd-text { fill: #f8fafc; font-weight: bold; }

      /* Colores por Categoría Oh My Zsh */
      .seg-blue { fill: #0284c7; }
      .seg-purple { fill: #7c3aed; }
      .seg-green { fill: #059669; }
      .seg-amber { fill: #d97706; }

      /* Colores de Salida */
      .out-blue { fill: #38bdf8; }
      .out-purple { fill: #c084fc; font-weight: bold; }
      .out-green { fill: #34d399; font-weight: bold; }
      .out-amber { fill: #fbbf24; font-weight: bold; }
      .out-dim { fill: #94a3b8; }
    </style>
  </defs>

  <!-- Ventana Terminal -->
  <rect x="1" y="1" width="878" height="538" class="window" />
  
  <!-- Barra de título -->
  <path d="M1,12 Q1,1 12,1 L868,1 Q879,1 879,12 L879,40 L1,40 Z" class="header" />
  <circle cx="22" cy="20" r="6" class="btn-red" />
  <circle cx="42" cy="20" r="6" class="btn-yellow" />
  <circle cx="62" cy="20" r="6" class="btn-green" />
  <text x="440" y="25" class="title">jaraneda@security-hub: ~ (zsh - agnoster)</text>

  <!-- Contenido de la Terminal -->
  <g class="code" transform="translate(24, 65)">
    
    <!-- ================= PROMPT 1: AZUL (PERFIL & IDENTIDAD) ================= -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="145" height="24" rx="3" class="seg-user" />
      <text x="10" y="17" class="seg-text-user">jaraneda@sec</text>
      <path d="M145,0 L157,12 L145,24 Z" class="seg-user" />
      
      <rect x="153" y="0" width="90" height="24" rx="3" class="seg-blue" />
      <text x="165" y="17" class="seg-text-path">~/perfil</text>
      <path d="M243,0 L255,12 L243,24 Z" class="seg-blue" />

      <text x="268" y="17" class="cmd-text">whoami</text>

      <text x="5" y="50" class="out-blue">❯ Juan Carlos Araneda Morales</text>
      <text x="5" y="72" class="out-dim">  Trayectoria:   +20 años en Infraestructura TI Crítica, Servidores y Redes</text>
      <text x="5" y="94" class="out-dim">  Especialidad:  Ciberseguridad Ofensiva/Defensiva, SysAdmin &amp; IA Aplicada</text>
    </g>

    <!-- ================= PROMPT 2: PÚRPURA (IA, LLMs LOCALES & RAG) ================= -->
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="145" height="24" rx="3" class="seg-user" />
      <text x="10" y="17" class="seg-text-user">jaraneda@sec</text>
      <path d="M145,0 L157,12 L145,24 Z" class="seg-user" />
      
      <rect x="153" y="0" width="155" height="24" rx="3" class="seg-purple" />
      <text x="165" y="17" class="seg-text-path">~/ia/local-llm-rag</text>
      <path d="M308,0 L320,12 L308,24 Z" class="seg-purple" />

      <text x="333" y="17" class="cmd-text">python -m ai_engine.status</text>

      <text x="5" y="48" class="out-purple">⚙️ [INFERENCIA LOCAL] Inferencia On-Premise con Ollama y LM Studio (Zero Cloud Leak)</text>
      <text x="5" y="70" class="out-purple">📚 [ARQUITECTURA RAG] Bases de Conocimiento Vectoriales, Embeddings &amp; Búsqueda Híbrida</text>
      <text x="5" y="92" class="out-purple">🤖 [AGENTES &amp; PROTOCOLOS] Agentes Autónomos ReAct y Model Context Protocol (MCP)</text>
    </g>

    <!-- ================= PROMPT 3: VERDE (CIBERSEGURIDAD & RED TEAM) ================= -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="145" height="24" rx="3" class="seg-user" />
      <text x="10" y="17" class="seg-text-user">jaraneda@sec</text>
      <path d="M145,0 L157,12 L145,24 Z" class="seg-user" />
      
      <rect x="153" y="0" width="145" height="24" rx="3" class="seg-green" />
      <text x="165" y="17" class="seg-text-path">~/ciberseguridad</text>
      <path d="M298,0 L310,12 L298,24 Z" class="seg-green" />

      <text x="323" y="17" class="cmd-text">cat sec_capabilities.log</text>

      <text x="5" y="48" class="out-green">🛡️ [AUDITORÍAS &amp; FRAMEWORKS] CIS Benchmarks | PCI DSS | ISO 27001 | Pentesting Web</text>
      <text x="5" y="70" class="out-green">🎯 [SEGURIDAD EN IA]        OWASP Top 10 for LLMs 2025 | Prompt Injection | Red Team</text>
      <text x="5" y="92" class="out-green">🔍 [VULNERABILIDADES]       Burp Suite | Kali Linux | Nessus | Hardening de Sistemas</text>
    </g>

    <!-- ================= PROMPT 4: ÁMBAR (INFRAESTRUCTURA & SERVIDORES) ================= -->
    <g transform="translate(0, 378)">
      <rect x="0" y="0" width="145" height="24" rx="3" class="seg-user" />
      <text x="10" y="17" class="seg-text-user">jaraneda@sec</text>
      <path d="M145,0 L157,12 L145,24 Z" class="seg-user" />
      
      <rect x="153" y="0" width="135" height="24" rx="3" class="seg-amber" />
      <text x="165" y="17" class="seg-text-path">~/infra/servidores</text>
      <path d="M288,0 L300,12 L288,24 Z" class="seg-amber" />

      <text x="313" y="17" class="cmd-text">ls -lh /infra/production</text>

      <text x="5" y="48" class="out-amber">🌐 [NETWORKING] Fortinet FortiGate | Cisco Switches/Routers | Ubiquiti UniFi | VPNs</text>
      <text x="5" y="70" class="out-amber">🖥️ [SISTEMAS]   Linux (RHEL/Debian) | Windows Server | Docker | Synology NAS | VMware</text>
    </g>

    <!-- Cursor prompt final -->
    <g transform="translate(0, 480)">
      <rect x="0" y="0" width="145" height="24" rx="3" class="seg-user" />
      <text x="10" y="17" class="seg-text-user">jaraneda@sec</text>
      <path d="M145,0 L157,12 L145,24 Z" class="seg-user" />
      
      <rect x="153" y="0" width="90" height="24" rx="3" class="seg-blue" />
      <text x="165" y="17" class="seg-text-path">~/perfil</text>
      <path d="M243,0 L255,12 L243,24 Z" class="seg-blue" />

      <rect x="268" y="3" width="10" height="18" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

  </g>
</svg>